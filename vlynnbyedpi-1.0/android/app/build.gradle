plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vlynn.byedpi'
    compileSdk 36

    defaultConfig {
        applicationId "com.vlynn.byedpi"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

